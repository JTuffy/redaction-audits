[project]
name = "redaction-audits"
version = "0.1.0"
description = "Evaluation harnesses for privacy-preserving redaction in AI audits: Redaction Under Escalation (P1) and Redaction Detective (P2)."
readme = "README.md"
authors = [{ name = "Josh Tuffy", email = "jtuffy117@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "inspect-ai>=0.3.279",
    "matplotlib>=3.9",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
redaction = "redaction.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "redaction"

[tool.uv]
default-groups = ["dev", "data"]

[dependency-groups]
data = [
    "polars>=2.0.0",
]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PL", "PT",
    "RET", "ARG", "PTH", "TID", "D", "ANN", "S", "LOG", "G", "ERA", "PERF",
]
ignore = [
    "D105", "D107",          # magic and __init__ docstrings
    "D203", "D213",          # use the D211 / D212 conventions
    "PLR0913",               # explicit parameters read better than config bags here
    "S311",                  # random is used for reproducible sampling, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN", "PLR2004", "TID251"]
# Escalation modules that drive Inspect; the rest of escalation/ stays Inspect-free.
"src/redaction/escalation/{calls,trial,task,runner,analysis,mock,ablation_task}.py" = ["TID251"]
"src/redaction/infra/**" = ["TID251"]
"src/redaction/data/pipeline/model_render.py" = ["TID251"]  # the model renderer drives Inspect
"scripts/**" = ["D", "ANN", "PLR2004", "INP001", "FBT"]  # one-off calculation scripts
"src/redaction/cli.py" = ["TID251", "PLR0917"]  # typer options are parameters
"src/redaction/viewer/build.py" = ["TID251"]  # reads Inspect logs for the Runs tab

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"inspect_ai".msg = "Keep core/, data/ and the pure escalation modules free of Inspect; see per-file-ignores."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=redaction --cov-report=term-missing"
markers = ["e2e: end-to-end pipeline runs against mock models"]
filterwarnings = [
    # Inspect's own retry setup uses a deprecated tenacity argument.
    "ignore:The 'initial' parameter is deprecated:DeprecationWarning",
]
