[[question]]
id = "H4"
title = "Under contextual rewrite, the executor blocks most attempts to soften the finding"
status = "partial"
answer = "The signal holds, but not by refusal: the executor grants most link-break requests and about four in ten removals, and the integrity check never fired. Read the rulings to see how a granted request leaves the link intact."
link = "#/notes/findings/does-the-executor-stop-an-adversarial-lab"

[[question.measure]]
