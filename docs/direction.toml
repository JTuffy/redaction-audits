# The research direction, curated by hand. The site's Overview page and the Runs grouping come
# from this file. Edit it in place when the direction changes; history lives in Decisions.

[project]
question = "When a lab redacts an audit report to protect its secrets, how much audit signal survives, and how much do the secrets still leak?"
hypothesis = "Redaction is nearly free when secrets and evidence are separate. When the secret is the evidence, the kind of link decides what is safe: consistent pseudonyms keep identity links, only property-preserving generalization keeps magnitudes and dates, and markers can hide real violations or incriminate innocent labs."
focus = "Scaling the benchmark: honest intervals on v2 first (clustered by evidence skeleton, per type), then a small simulator demo that draws scenario attributes from distributions instead of fixed rules."
next = "Simulator demo for one violation type; then v3 at about 5x scale with model rendering, a structural test hold-out and a 60-scenario human label check; rerun the headline cells; realism tier on MALT transcripts after."
updated = "2026-10-23"

# Running findings for the Overview: the proposal's hypotheses (H1-H4) and our own (E1).
# status: supported | partial | untested | refuted. `answer` is the current one-line reading.
# Each measure is pooled over every full run (no `--limit`, no chosen samples) that matches its
# policy, stance and set on the split and judge in [pooling]; the site computes the numbers.
# metric: persistence | leakage | fnr | fpr | grant_rate | as_asked | rewritten | denied |
# integrity_flags (as_asked, rewritten, denied: shares of the executor's rulings). set: disjoint |
# entangled | all.

[pooling]
split = "dev"
judge = "openai/gpt-5.6-terra"

[[question]]
id = "H1"
title = "Text redaction keeps the most signal but leaks the most"
status = "partial"
answer = "It leaks the most. It keeps the signal only when secrets and evidence are separate; when they overlap it keeps the least."
link = "#/notes/findings/how-much-do-secrets-leak"

[[question.measure]]
label = "Leakage · text redaction"
metric = "leakage"
policy = "text_redaction"
stance = "honest"
set = "all"

[[question.measure]]
label = "Leakage · contextual rewrite"
metric = "leakage"
policy = "contextual_rewrite"
stance = "honest"
set = "all"

[[question.measure]]
label = "Persistence · text redaction, entangled"
metric = "persistence"
policy = "text_redaction"
stance = "honest"
set = "entangled"

[[question.measure]]
label = "Persistence · contextual rewrite, entangled"
metric = "persistence"
policy = "contextual_rewrite"
stance = "honest"
set = "entangled"

[[question]]
id = "H2"
title = "An adversarial advocate obscures the signal, most under contextual rewrite"
status = "untested"
answer = "Not answered: the model refused the cover-up role. As a red team it found a real attack, but with the executor the signal held."
link = "#/notes/findings/does-the-executor-stop-an-adversarial-lab"

[[question.measure]]
label = "Persistence · contextual rewrite, red team, entangled"
metric = "persistence"
policy = "contextual_rewrite"
stance = "red_team"
set = "entangled"

[[question.measure]]
label = "Persistence · contextual rewrite, honest, entangled"
metric = "persistence"
policy = "contextual_rewrite"
stance = "honest"
set = "entangled"

[[question]]
id = "H3"
title = "Without an honest executor, an adversarial lab cuts the signal sharply"
status = "supported"
answer = "Yes, as bounds from scripted attacks: link-break and evidence removal hurt only without the executor. A model adversary without one is unmeasured."
link = "#/notes/findings/does-the-executor-stop-an-adversarial-lab"

[[question.measure]]
label = "Persistence · self-redaction, link-break, entangled"
metric = "persistence"
policy = "self_redaction"
stance = "scripted_link"
set = "entangled"

[[question.measure]]
label = "Persistence · contextual rewrite, link-break, entangled"
metric = "persistence"
policy = "contextual_rewrite"
stance = "scripted_link"
set = "entangled"

[[question.measure]]
label = "Persistence · self-redaction, removal, entangled"
metric = "persistence"
policy = "self_redaction"
stance = "scripted_blatant"
set = "entangled"

[[question.measure]]
label = "Persistence · contextual rewrite, removal, entangled"
metric = "persistence"
policy = "contextual_rewrite"
stance = "scripted_blatant"
set = "entangled"

[[question]]
id = "H4"
title = "Under contextual rewrite, the executor blocks most attempts to soften the finding"
status = "supported"
answer = "For the scripted attacks, yes, mostly by rewriting rather than refusing: it turned most link-break markers into consistent pseudonyms (which keep the link) and denied most evidence removals, rewriting the rest as generalizations. The integrity check never fired. The model red team is one run."
link = "#/notes/findings/does-the-executor-stop-an-adversarial-lab"

[[question.measure]]
label = "Link-break requests · granted as asked"
metric = "as_asked"
