# Follow-up questions: each tweaks one thing on the same dataset and harness, so the paper can
# answer many questions with one vetted benchmark. status: idea | planned | running | done.

[[followup]]
id = "ceiling"
question = "Do the results hold when the judge isn't at ceiling on unedited evidence?"
tweak = "An easy and a hard tier, or a mix tuned so the frontier judge sits near 0.8 unedited; report absolute AUROC drop beside persistence."
status = "idea"

[[followup]]
id = "lexical"
question = "How much of the signal rests on one explicit token rather than on reading lines together?"
tweak = "Measure single-line decidability and label-exclusive tokens per build; report, don't gate."
status = "idea"

[[followup]]
id = "entanglement-dose"
question = "How does persistence fall as more of the finding's links run through secrets?"
tweak = "Entanglement as a measured attribute (0 to 3+ secret links), analysed as a covariate, not a category."
status = "planned"

[[followup]]
id = "org-secrets"
question = "Does redaction behave differently when the secret is organizational structure rather than a value?"
tweak = "New secret and violation families away from obvious answers: who reports to whom, which team owns a model, who approved what."
status = "idea"

[[followup]]
id = "judge-strength"
question = "Does a weaker reader lose more signal from the same redactions?"
tweak = "Same edits judged by GPT-5-mini and GPT-5.6 Terra (and a third family)."
status = "idea"

[[followup]]
id = "attack-leakage"
question = "How much leaks when the lab is adversarial?"
tweak = "Leakage under the scripted and red-team stances, by correlate strength."
status = "planned"

[[followup]]
id = "model-adversary"
question = "How much does a model adversary cut the signal without an executor?"
tweak = "An advocate from another provider for both arms."
status = "planned"

[[followup]]
id = "display"
question = "Does the redaction display (marker, marker with reason, pseudonym) move the judge by itself?"
tweak = "The marker ablation at v3 scale."
status = "idea"

[[followup]]
id = "model-auditor"
question = "Do the results transfer when an auditor must find the evidence itself?"
tweak = "Model auditor on the realism tier (evidence planted in MALT transcripts)."
status = "planned"

[[followup]]
id = "aggregation"
question = "Does leakage add up across several redacted reports about the same lab?"
tweak = "Multiple reports per lab, scored jointly; the bridge to P2."
status = "idea"

# One entry per experiment thread, newest first. status: planned | running | open | settled | blocked
# finding names the Findings section the thread feeds; runs lists recorded run names.

[[experiment]]
id = "background"
title = "Background that can't be filtered"
question = "Can planted lines be told from background by surface alone (source, format, length), without reading them?"
status = "open"
result = "Philly scheduler lines: surface AUROC 0.997. Lab-style background: about 0.62. Runs on the new builds pending."
finding = "Can background be dropped without reading it?"
runs = []

[[experiment]]
id = "adversary"
title = "Adversarial lab"
question = "Does the honest executor stop a lab that asks for edits which hide the finding: removing evidence outright, or markers that break the link a finding turns on?"
status = "open"
result = "Yes: without the executor, link-break keeps 0.52 of entangled signal and evidence removal 0.15; with it, 0.95. Red-team self-redaction not measured (model refused)."
finding = "Does the executor stop an adversarial lab?"
runs = []

[[experiment]]
id = "entangled"
title = "Entanglement"
question = "When the secret is the link between evidence lines, does redaction finally cost signal, and do pseudonyms keep it where markers don't?"
status = "open"
result = "Yes, on all six types: markers drop entangled AUROC to 0.67–0.74 (disjoint stays 1.00); pseudonyms restore identity links, generalization restores magnitudes."
finding = "Does redaction cost signal when the secret is the evidence?"
runs = []

[[experiment]]
id = "deep"
title = "Deep variants"
question = "Do five-to-six-line scenarios, decided by a relation between lines, make the task harder?"
status = "settled"
result = "Archived: not harder for the frontier judge (AUROC 1.00); replaced by the entangled set."
finding = "Do deep variants make the task harder?"
runs = ["ablation-dev-20261022T195510Z", "ablation-val-20261022T195555Z", "ablation-dev-20261022T195830Z", "ablation-val-20261022T195910Z"]

[[experiment]]
id = "difficulty"
title = "Difficulty by judge"
question = "Do red herrings get harder with designed difficulty?"
status = "settled"
result = "Yes for GPT-5-mini (easy 9, medium 39, hard 70); medium and hard sit together for GPT-5.6 Terra."
finding = "Do red herrings get harder with difficulty?"
runs = ["ablation-val-20261022T195635Z", "ablation-dev-20261022T195949Z", "ablation-val-20261022T200044Z"]

[[experiment]]
id = "cues"
title = "Paraphrased cues"
question = "Does rephrasing the cues that separate labels make the task harder?"
status = "settled"
result = "No: AUROC 1.00, 1.00 and 0.99 for template, model-rendered and paraphrased builds."
finding = "Does rephrasing make the task harder?"
runs = ["ablation-dev-20261022T190415Z", "ablation-dev-20261022T190509Z", "ablation-dev-20261022T190559Z"]

[[experiment]]
id = "leakage"
title = "Leakage by policy"
question = "How much do secrets leak under each policy?"
status = "open"
result = "Dev benchmark, honest lab: text redaction 0.84, pseudonyms and generalize about 0.89, contextual rewrite 0.42–0.48, self-redaction 0.23–0.38. The 12-scenario pilot gave the same order."
finding = "How much do secrets leak?"
runs = ["p1-dev-honest-20261021T221138Z", "p1-dev-honest-20261022T162358Z"]

[[experiment]]
id = "coverup"
title = "Cover-up stance"
question = "Does the honest executor stop a lab that wants the finding gone?"
status = "settled"
result = "Superseded by the adversary harness: Sonnet refuses the cover-up role, but plays it as a red-team exercise when the executor is in the loop."
finding = "Does the executor stop an adversarial lab?"
runs = ["p1-dev-cover_up-20261021T225602Z"]

[[experiment]]
id = "markers"
title = "Marker ablation"
question = "Does a visible redaction marker, by itself, make evidence look guiltier?"
status = "open"
result = "Inconclusive at n = 6 per cell; one re-ask in six moves 15+ points."
finding = "Do redaction markers make evidence look guiltier?"
runs = ["ablation-dev-20261021T225602Z", "ablation-dev-20261021T225748Z", "ablation-dev-20261021T225812Z"]

[[experiment]]
id = "smoke"
title = "Smoke tests"
question = "Does the pipeline run end to end on real models?"
status = "settled"
result = "Yes, after a fix to the self-redaction prompt."
finding = ""
runs = ["p1-dev-honest-20261021T220616Z", "p1-dev-honest-20261021T220905Z"]
